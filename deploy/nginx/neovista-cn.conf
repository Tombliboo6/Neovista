server {
    listen 80;
    listen [::]:80;
    server_name neovista.cn www.neovista.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://neovista.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.neovista.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://api.neovista.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.neovista.cn;

    ssl_certificate /etc/letsencrypt/live/neovista.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neovista.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://neovista.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neovista.cn;

    ssl_certificate /etc/letsencrypt/live/neovista.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neovista.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The backend permits up to 24 MiB of encoded reference data. Keep enough
    # room for the JSON envelope while retaining an explicit gateway ceiling.
    client_max_body_size 26M;
    client_body_timeout 30s;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    root /var/www/neovista/frontend/dist;
    index index.html;

    location ~* ^(.*\.env|.*\.git|.*\.db|.*\.sqlite|.*\.pem|.*\.key|/node_modules/|/backend/|/frontend/|/deploy/|/tests/) {
        return 404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite chunks are content-addressed. A missing chunk must be a real 404 and
    # must never fall through to the SPA HTML shell.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Gallery filenames are currently stable across releases, so they are not
    # content-addressed and must never inherit the one-year immutable rule from
    # the generic image matcher below. Keep the window short until URLs are
    # release-versioned; must-revalidate prevents a stale response being reused
    # after that window without checking the origin.
    location ^~ /gallery/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    # Video reference data URLs may be larger than ordinary API requests. The
    # application additionally caps each decoded image and the sanitized total.
    location = /api/v1/video/generate {
        client_max_body_size 26M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only public hop. Replace, rather than append, caller XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only public hop. Replace, rather than append, caller XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    # Seedance providers must fetch these unguessable temporary URLs without
    # authentication. They must never be cached, indexed, or rendered as pages.
    location ^~ /static/seedance_references/ {
        root /var/www/neovista/backend;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires off;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        log_not_found off;
    }

    location ^~ /static/ {
        root /var/www/neovista/backend;
        try_files $uri $uri/ =404;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; object-src 'none'; base-uri 'none'; sandbox" always;
        access_log off;
    }

    location ~* ^/(?!api/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.neovista.cn;

    ssl_certificate /etc/letsencrypt/live/neovista.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neovista.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 26M;
    client_body_timeout 30s;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /api/v1/video/generate {
        client_max_body_size 26M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    # Reference URLs are issued only on the canonical root domain. The API
    # subdomain must not become a second anonymous static-file origin.
    location ^~ /static/seedance_references/ {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }
}
