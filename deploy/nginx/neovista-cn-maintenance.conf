server {
    listen 80;
    listen [::]:80;
    server_name neovista.cn www.neovista.cn api.neovista.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Cache-Control "private, no-store" always;
        add_header Retry-After "300" always;
        return 503 "NeoVista maintenance in progress\n";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neovista.cn www.neovista.cn api.neovista.cn;

    ssl_certificate /etc/letsencrypt/live/neovista.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neovista.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header Retry-After "300" always;

    location / {
        default_type text/plain;
        return 503 "NeoVista maintenance in progress\n";
    }
}
