server {
    listen 80;
    listen [::]:80;
    server_name neovista.cn www.neovista.cn api.neovista.cn;

    # Keep the ACME challenge reachable before the production certificate exists.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Until HTTPS is provisioned, send visitors to the currently healthy host.
    location / {
        return 302 https://neotest.site$request_uri;
    }
}
