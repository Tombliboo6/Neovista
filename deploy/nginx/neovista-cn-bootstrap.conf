server {
    listen 80;
    listen [::]:80;
    server_name neovista.cn www.neovista.cn api.neovista.cn;

    # Keep the ACME challenge reachable before the production certificate exists.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Fail closed until the neovista.cn certificate and production vhost exist.
    # Never redirect production traffic through a legacy host.
    location / {
        default_type text/plain;
        add_header Retry-After "300" always;
        return 503 "NeoVista HTTPS provisioning in progress\n";
    }
}
