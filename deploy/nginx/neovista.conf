server {
    listen 80;
    server_name neotest.site www.neotest.site;

    return 301 https://neotest.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.neotest.site;

    ssl_certificate /etc/letsencrypt/live/neotest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://neotest.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name neotest.site;

    ssl_certificate /etc/letsencrypt/live/neotest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传大小限制（图片/文件上传）
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # 前端静态文件
    root /var/www/neovista/frontend/dist;
    index index.html;

    # 阻断敏感文件和源码目录，避免 SPA fallback 把探测请求伪装成 200
    location ~* ^(.*\.env|.*\.git|.*\.db|.*\.sqlite|.*\.pem|.*\.key|/node_modules/|/backend/|/frontend/|/deploy/|/tests/) {
        return 404;
    }

    # HTML 壳始终回源，避免旧标签页长期拿不到新 bundle 入口
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物必须真实存在；缺失 chunk/source map 不允许回退到 index.html 伪装成 200
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    # API 反向代理
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx 是唯一公网入口：覆盖客户端自带 XFF，避免伪造首地址绕过应用限流。
        # 若未来接入可信 CDN/LB，应先配置 real_ip 模块白名单，再继续传递 $remote_addr。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";

        # Seedance 上游调用超时为 180 秒；网关窗口略长，避免网关先断开而后端仍在提交任务。
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Seedance 参考图需要被供应商按 URL 拉取，但不得进入浏览器/代理缓存或被索引。
    # 该路径仍是临时公开 URL；后续应由短期签名对象 URL + 终态/TTL 清理替代。
    location ^~ /static/seedance_references/ {
        root /var/www/neovista/backend;
        try_files $uri =404;
        expires off;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        access_log off;
        log_not_found off;
    }

    # 后端静态文件直接由 Nginx 提供，避免模板图库图片再次回源到 FastAPI
    location ^~ /static/ {
        root /var/www/neovista/backend;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 前端静态资源缓存（不会误伤 /static/）
    location ~* ^/(?!api/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
