server {
    listen 80;
    server_name neotest.site www.neotest.site;

    return 301 https://neotest.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.neotest.site;

    ssl_certificate /etc/letsencrypt/live/neotest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://neotest.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name neotest.site;

    ssl_certificate /etc/letsencrypt/live/neotest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neotest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传大小限制（图片/文件上传）
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # 前端静态文件
    root /var/www/neovista/frontend/dist;
    index index.html;

    # HTML 壳始终回源，避免旧标签页长期拿不到新 bundle 入口
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端静态文件直接由 Nginx 提供，避免模板图库图片再次回源到 FastAPI
    location ^~ /static/ {
        alias /var/www/neovista/backend/static/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # 前端静态资源缓存（不会误伤 /static/）
    location ~* ^/(?!api/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
